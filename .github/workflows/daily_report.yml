name: Daily Nifty options terminal

on:
  schedule:
    - cron: "30 13 * * 1-5"   # 19:00 IST, after NSE publishes end-of-day files
    - cron: "30 15 * * 1-5"   # 21:00 IST backup run (skips if the report already exists)
  workflow_dispatch:           # run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests (must pass before anything is published)
        run: python -m unittest discover -s tests -t . -v
      - name: Build report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # optional
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}       # optional
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m src.build_report
      - name: Short brief in the run summary
        run: |
          if [ -f reports/latest.md ]; then cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Save to repo
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add data docs reports
          git diff --cached --quiet || git commit -m "Report $(date -u +%F)"
          git pull --rebase
          git push

      - name: Package dashboard for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
